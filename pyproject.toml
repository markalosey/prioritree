[project]
name = "prioritree"
version = "0.1.0"
description = "Priori-tree is a generalized prioritization system: for any list and comparison operator, run the pairwise permutations, store the votes, tally — the output list is in a superior order than sizing individual items, because discernment between two items is easy (for humans and LLMs) while absolute sizing is not."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Mark Losey" }]
dependencies = ["fastapi", "httpx2", "itsdangerous", "jinja2", "ouncemcp", "python-multipart", "uvicorn[standard]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
prioritree = "prioritree.cli:command"

[tool.hatch.build.targets.wheel]
packages = ["src/prioritree"]

# RULING (install-brief §2 + Q-repo-review ruling 4, G-INSTALL-BRIEF approved
# 2026-11-22): the wheel SHIPS the web tier's authored homes as package data —
# web/templates + web/static map INTO the package at flat dests (prioritree/
# templates, prioritree/static — NO prioritree/web/ directory: the web.py
# module's namespace-portion is never shadowed). The clone is untouched (the
# mapping is build-time only, zero moves on disk); web.py's loader seam
# resolves the CWD's copy first, this shipped copy the fallback. The MCP rides
# by construction (mcp_server.py among the nineteen modules packages carries).
[tool.hatch.build.targets.wheel.force-include]
"web/templates" = "prioritree/templates"
"web/static" = "prioritree/static"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
# THE SEED'S OWN STRICTNESS (tane/pyproject.toml:90-96 the precedent): every rule on;
# the ONLY exceptions are NAMED RULINGS — where a rule's intent and a stated law
# of the tree genuinely disagree, the disagreement goes to a ruling — never resolved
# silently. Nothing else is ignored, ever.
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# RULING R1 (inherited from tane/pyproject.toml:106-112, the family's settled ruling):
# assert IS pytest's assertion form — S101's intent (assert stripped under -O) never
# applies to tests. R1's second limb: the tests' assertions compare against concrete
# expected values — the literals ARE the specification under test. PLR2004 rides R1.
"tests/**" = ["S101", "PLR2004"]
# RULING (scheduler-brief §§2-3, G-SCHEDULER-BRIEF approved 2026-11-20): the seed is the
# reserved seam parameter — ruled UNUSED by the approved brief's own reservation clause
# ("UNUSED by the ruled order; carried so the hidden scheduler seam's widening is additive,
# never rework"). ARG001 fires on exactly that ruled surface; the ignore IS the ruling,
# named. It retires when U5's next_pair consumes the seed.
"src/prioritree/scheduler.py" = ["ARG001"]
# RULING (votes-brief §3, G-VOTES-BRIEF approved 2026-11-20): cast_vote's eight arguments ARE
# op 3's ruled signature (the presentation_order the probe's instrument, additive) —
# scope-synthesis PART 3 §3.2's verbatim spec (run_id, pair, winner,
# comparator_id, comparator_class, notes?, supersedes?, presentation_order? — the five-op
# interface's own letter, approved at the gate). PLR0913/PLR0917 fire on exactly that ruled
# surface; the ignore IS the ruling, named. It retires only if the interface itself is re-ruled.
"src/prioritree/votes.py" = ["PLR0913", "PLR0917"]
# RULING (session-brief §2/§5, G-SESSION-BRIEF approved 2026-11-20): ExhaustedQueue is the DONE
# signal — a TERMINAL STATE, not an error (the suffix-free name follows StopIteration's grammar;
# the Error suffix marks the refusal lineage, blurring the type distinction the class carries).
# cast_vote's eight arguments ARE op 3's ruled signature (the probe's instrument additive; the votes.py ruling re-cited).
"src/prioritree/session.py" = ["N818", "PLR0913", "PLR0917"]
# RULING (acceptance-brief §2 + §6, G-ACCEPTANCE-BRIEF approved 2026-11-20): S311 — the
# harness's ONE random.Random(seed) instance is the ruled reproducibility seam — a SEEDED
# SIMULATION, stdlib-reproducible, private state, the tree's first random import (the
# simulation's own, seed-pinned), never a cryptographic surface; the rule's crypto intent
# does not apply to the ruled band. ARG001 — floor_holds's `tied` parameter rides the tests'
# ruled call form (the five edges pass the record's counts whole; the floor inequality
# itself needs only P, Q, n0 — brief §3): the parameter is the ruled surface. The ignores
# ARE the rulings, named.
"src/prioritree/acceptance.py" = ["S311", "ARG001"]

# RULING (run-store-brief §1 + Q-cli-shape, G-RUN-STORE-BRIEF approved 2026-11-20): cast's
# signature IS the door's ruled cast_vote signature mapped 1:1 (op 3's ruled eight arguments
# — the probe's instrument additive, the frozen wrapper contract; the votes.py/session.py PLR0913/PLR0917 rulings re-cited at
# the wrapper tier, Q-cli-shape's own 1:1 mapping). PLR0913/PLR0917 fire on exactly that
# ruled surface; the ignore IS the ruling, named.
"src/prioritree/run_store.py" = ["PLR0913", "PLR0917"]

# RULING (command-face-brief §3 + Q-cli-io, G-COMMAND-FACE-BRIEF approved 2026-11-21): T201 —
# print IS the command face's ruled instrument (the report language's two render points,
# _report/_report_error — every stdout/stderr byte rides them; the DONE message and the
# refusal pass-through included); the rule's logging-library intent does not apply to a
# CLI's own report channel. BLE001 — the blind `except Exception` IS Q-cli-io's ruled
# unexpected channel (exit 2, the traceback verbatim; SystemExit propagates untouched —
# BaseException, argparse's own channel). The ignores ARE the rulings, named.
"src/prioritree/cli.py" = ["T201", "BLE001"]

# RULING (cli-acceptance-brief §4, G-CLI-ACCEPTANCE-BRIEF approved 2026-11-21): S603 — the harness's
# subprocess.run IS the no-shell law's own form (fixed-argv lists composed from the test's own constants;
# the untrusted-input intent never rides a deterministic e2e harness — the arcs drive the tree's own
# console script). S607 — the partial-path executable finding, dodged by the full-path form but named
# for the ruling's stability. Scoped to the one file that subprocesses; the ignores ARE the rulings, named.
# RULING (the policylayerspec fold Ruling C, G-POLICYLAYERSPEC-BRIEF approved 2026-11-24): PLR0913 —
# _vote_argv's parameters ARE the CLI's fixed-argv vote act mirrored at the fixture tier (home, item_a,
# item_b, comparator_class); the entry prophylactic per the fold — the four-parameter mirror sits under
# the six-argument bar today, dead until the signature grows past five; the floor instruments decide.
# The S603/S607 ruling re-carried at the same entry (TOML bars duplicate keys); the ignore IS the ruling, named.
"tests/test_harness.py" = ["PLR0913", "S603", "S607"]

# RULING (budget-curve-brief §7 + Q-curve-floor, G-BUDGET-CURVE-BRIEF approved 2026-11-21): S311 —
# the harness's random.Random instances are the ruled reproducibility seam (the seeded simulation,
# the acceptance.py entry's kin at the same approved-brief citation); ARG001 named per the brief —
# the call forms decide, the entry listed, the ignore IS the ruling, named.
"src/prioritree/budget_curve.py" = ["S311", "ARG001"]

# RULING (service-store-brief §5, G-SERVICE-STORE-BRIEF approved 2026-11-21): the seam's
# cast signature IS the door's ruled cast_vote signature mapped 1:1 (the eight-argument
# form mirroring Persist.cast — the probe's instrument additive, the run_store.py precedent re-cited at the request tier:
# Q-service-concurrency's per-request composition preserves the frozen wrapper contract).
# PLR0913/PLR0917 fire on exactly that ruled surface; the ignore IS the ruling, named.
"src/prioritree/service_store.py" = ["PLR0913", "PLR0917"]

# RULING (service-face-brief §6, G-SERVICE-FACE-BRIEF approved 2026-11-21): BLE001 —
# the 500 crash-envelope handler's except Exception IS the ruled catch-all (the app-level
# fold: crashes first-class citizens, the article's three-part form; Starlette re-raises
# so the traceback rides the log channel, never the body — the cli.py precedent re-cited).
# PLC0415 (web-brief §3c + G-WEBSPEC-BRIEF approved 2026-11-22): the tail's mid-file
# web import IS the import cycle's only legal form — the web module binds service.app at
# ITS top, so the import must fire AFTER the app binds; a top-of-file import would fire
# before, an importlib dodge would HIDE the cycle, not name it.
# ARG001 (the spec reports/synthesize/servingtierintegrationspec.md §1d/§8,
# G-SERVING-TIER-INTEGRATION-BRIEF approved 2026-11-24): the five non-cast doors'
# record parameters ARE the ruled gate (the dependency's 401/403 raise IS the act; the
# value consumed at the cast route alone — the scheduler.py ARG001 precedent
# re-carried at the door tier); the two key-refusal handlers' request parameters ride
# Starlette's fixed (request, exc) exception-handler signature — the body renders the
# refusal alone. The ignores ARE the rulings, named.
"src/prioritree/service.py" = ["BLE001", "E402", "PLC0415", "ARG001"]

# RULING (service-acceptance-brief §7, G-SERVICE-ACCEPTANCE-BRIEF approved 2026-11-22): S603 —
# the acceptance harness's Popen IS the no-shell law's own form (the fixed-argv boot list —
# the sibling uvicorn binary, the module:app target, the pinned flags; the untrusted-input
# intent never rides a deterministic e2e harness). S607 named for the ruling's form's stability.
# The tests/test_harness.py ruling re-carried at the service tier; the entry IS the ruling, named.
"tests/test_service_acceptance.py" = ["S603", "S607"]

# RULING (web-brief §3b + G-WEBSPEC-BRIEF approved 2026-11-22): BLE001 — the child's own
# fold handler's except Exception IS the ruled catch-all (the service.py precedent
# re-carried at the child: crashes first-class citizens; the fragment lane renders the
# fold at 200, the page lane the honest 500). The ignore IS the ruling, named.
# RULING (the spec reports/synthesize/servingtierintegrationspec.md §3a/§3d,
# G-SERVING-TIER-INTEGRATION-BRIEF approved 2026-11-24): S105 — _CSRF_SECRET_ENV's
# literal is the env knob's own public NAME (the constant names the secret's source,
# the boot-mint fallback the configurability law — never a credential in source);
# the wording grown per the voter-session spec §4 (G-VOTERSESSIONSPEC-BRIEF approved
# 2026-11-26): _REMEMBER_SECRET_ENV's literal the SAME public-name class (the remember
# knob's own NAME, the same boot-mint fallback — the same ruling, no new entry);
# PLR0911 — sitting's and result's return counts ARE the ruled lane's own form
# (§3d's exact two-branch insert at every fold site grows the page routes past the
# rule's bar — the 401/403 branches before the fold branch ARE the ruled surface);
# C901 — result's complexity likewise the ruled lane's branches (11 past the rule's 10).
# The ignores ARE the rulings, named.
"src/prioritree/web.py" = ["BLE001", "S105", "PLR0911", "C901"]

# RULING (mcp-server-brief SS2 + the spec reports/synthesize/mcpserverspec.md SS2(g),
# G-MCPSERVER approved 2026-11-22): D205 -- the five tool docstrings ARE the tool
# descriptions VERBATIM (the design brief SS2's authored texts, the build's acceptance):
# a blank line after the summary line would insert a newline INTO the tool's wire
# description, forking the accepted bytes; the rule's summary-blank-line intent never
# applies to a single-paragraph description. The ignore IS the ruling, named. It
# retires only if the descriptions are re-authored multi-paragraph.
"src/prioritree/mcp_server.py" = ["D205"]

# RULING (mcp-server-brief SS5a + the exact-task spec
# reports/synthesize/mcpserverspec.md SS5(a)/SS3(c), G-MCPSERVER approved
# 2026-11-22): S603 — the lock-face harness's Popen IS the no-shell law's own
# form (the fixed-argv lists — sys.executable + "-c" + the fixed in-source
# child programs, the console script at its full venv path; the
# untrusted-input intent never rides a deterministic concurrency probe).
# S607 named for the ruling's form's stability (dodged by the full-path form —
# the tests/test_harness.py + tests/test_service_acceptance.py rulings
# re-carried at the lock-seam tier; the entry IS the ruling, named).
"tests/test_store_lock_face.py" = ["S603", "S607"]

# RULING (policylayerspec §3b, G-POLICYLAYERSPEC-BRIEF approved 2026-11-24): _vote's six parameters ARE the fence's ruled
# builder signature — the helper mirrors VoteRecord's own fields (vote_id, pair, winner, comparator_class, notes, supersedes —
# the votes' own signature carried at the fixture tier; the votes.py/session.py/run_store.py/service_store.py PLR0913 rulings
# re-cited). The arg count is the domain's, not the test's choice; the ignore IS the ruling, named. It retires only if the
# record's own signature is re-ruled.
"tests/test_tally.py" = ["PLR0913"]

# RULING (the policylayerspec fold Ruling B, G-POLICYLAYERSPEC-BRIEF approved 2026-11-24): _cast's six parameters ARE
# the cast tool's own parameters mirrored at the fixture tier (caller, pair, winner, comparator_id, comparator_class,
# supersedes — the tool's ruled signature carried at the fixture tier; the votes.py/session.py/run_store.py/
# service_store.py PLR0913/PLR0917 rulings re-cited). The arg count is the domain's, not the test's choice; the
# ignore IS the ruling, named. It retires only if the tool's own signature is re-ruled.
"tests/test_mcp_server_face.py" = ["PLR0913", "PLR0917"]

# RULING R4 (the coordinator's ruling on the step-6 report's 38 findings under this select
