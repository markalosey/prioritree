# is hikari's VERBATIM CARGO — its bytes never edited at prioritree (the delivery note's
# law), so every finding rules here, the S311 entry's own pattern extended. The fork-free
# cargo — hikari's verbatim emission bytes: the header [CPY001], the shebang [EXE001],
# hikari's docstring conventions [D401/D403/D103], hikari's annotation style
# [PYI041/TC003/PIE808], the numeric constants [PLR2004]. The trace-line output IS prints —
# the provenance schema's own form [T201]. The 30-case argparse dispatch — the registry's
# shape [PLR0911/PLR0915]. The seeded seam [S311, standing — the shuffle op seeds its ONE
# random.Random(seed) instance, the ruled reproducibility seam (the seed IS the input: the
# same seed always yields the same permutation), a SEEDED SIMULATION, stdlib-reproducible,
# private state, never a cryptographic surface; the rule's crypto intent does not apply to
# the ruled band; the acceptance.py/budget_curve.py S311 precedent re-carried at the engine
# tier]. The entry — never an in-engine noqa — keeps the verbatim-copy bytes fork-free (the
