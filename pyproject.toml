# never blanket, no code unnamed.
".opencode/scripts/calculate.py" = ["CPY001", "EXE001", "D401", "D403", "D103", "T201", "PYI041", "PLR2004", "PLR0911", "PLR0915", "PIE808", "TC003", "S311"]

# RULING (Q-CALC-EXPANSION, ruled 2026-11-25; the KAT is prioritree's test file — the
# fork-free law is the ENGINE's, never the KAT's): S603 — the KAT's fixed-argv subprocess
